# Gate workloads: one EC2NodeClass and two NodePools. The S0 manual run keeps using ../nodepool.yaml.
# Karpenter resolves the AMI through the SSM alias, the subnets and security groups through the discovery tag,
# and the instance profile from the role.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: KarpenterNodeRole-meridian-g0            # created by the seed script; Karpenter builds the profile from it
  amiSelectorTerms:
    - alias: al2023@latest                       # resolved through the SSM parameter Floci serves
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: meridian-g0}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: meridian-g0}
---
# On-demand pool: two interchangeable sizes with different prices, so the choice shows Karpenter used the
# price data (gate criterion 5). Both types are in node-registrar's catalog AND in Floci's DescribeInstanceTypeOfferings:
# Floci offers only 19 types, so c5.large (in the catalog) is never launchable; t3.medium and m5.large are the pair that
# is. t3.medium is the cheaper but sorts after m5.large, so choosing it cannot be an accident of ordering.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ondemand
spec:
  limits:
    cpu: "10"                                    # A9: at most five 2-vCPU nodes per pool, about ten for the gate
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["t3.medium", "m5.large"]}
        - {key: kubernetes.io/arch, operator: In, values: ["amd64"]}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s                        # short so the gate does not wait minutes (criterion 3)
---
# Spot pool: the gate interrupts a node from this pool (criterion 4).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot
spec:
  limits:
    cpu: "10"                                    # A9
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: ["spot"]}
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["m5.large"]}
        - {key: kubernetes.io/arch, operator: In, values: ["amd64"]}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
