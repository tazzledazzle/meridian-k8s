# Pending pods that force Karpenter to provision capacity. Replicas start at 0; the gate scales them.
apiVersion: apps/v1
kind: Deployment
metadata: {name: inflate-ondemand, namespace: default}
spec:
  replicas: 0                                    # the gate scales it up
  selector: {matchLabels: {app: inflate-ondemand}}
  template:
    metadata: {labels: {app: inflate-ondemand}}
    spec:
      nodeSelector: {karpenter.sh/nodepool: ondemand}   # only Karpenter-launched nodes may run this
      tolerations:
        # Every Karpenter node here is a KWOK node, which carries this taint (without it Karpenter
        # provisions a second NodeClaim, see docs/s0/criterion3.md).
        - {key: kwok.x-k8s.io/node, operator: Equal, value: fake, effect: NoSchedule}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources: {requests: {cpu: "1", memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inflate-spot, namespace: default}
spec:
  replicas: 0                                    # the gate scales it up
  selector: {matchLabels: {app: inflate-spot}}
  template:
    metadata: {labels: {app: inflate-spot}}
    spec:
      nodeSelector: {karpenter.sh/nodepool: spot}   # only Karpenter-launched nodes may run this
      tolerations:
        # Every Karpenter node here is a KWOK node, which carries this taint (without it Karpenter
        # provisions a second NodeClaim, see docs/s0/criterion3.md).
        - {key: kwok.x-k8s.io/node, operator: Equal, value: fake, effect: NoSchedule}
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources: {requests: {cpu: "1", memory: 512Mi}}
