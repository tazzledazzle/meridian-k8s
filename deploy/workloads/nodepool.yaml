apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest                       # resolves to the SSM parameter Floci serves for this Kubernetes minor
  role: KarpenterNodeRole-meridian-g0
  subnetSelectorTerms:
    - tags: {karpenter.sh/discovery: meridian-g0}
  securityGroupSelectorTerms:
    - tags: {karpenter.sh/discovery: meridian-g0}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  limits:
    cpu: "40"                                     # A9: caps the pool at roughly ten small nodes
  template:
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"]}
        - {key: karpenter.k8s.aws/instance-category, operator: In, values: ["m", "c"]}
        - {key: karpenter.k8s.aws/instance-size, operator: In, values: ["large", "xlarge"]}
        # node-registrar sizes KWOK nodes from internal/catalog, so only offer Karpenter the types the catalog knows.
        # Floci's DescribeInstanceTypes lists many more (for example m6gd.large), and those cannot become Nodes.
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["c5.large", "c5.xlarge", "m5.large", "m5.xlarge"]}
        - {key: kubernetes.io/arch, operator: In, values: ["amd64"]}
